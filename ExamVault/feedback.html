<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cursor.css">
<!-- EMAILJS -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#0f172a;

    color:white;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}

.container{

    width:100%;

    max-width:500px;

    background:#1e293b;

    padding:35px;

    border-radius:24px;

    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

h1{

    text-align:center;

    margin-bottom:10px;

    color:#38bdf8;
}

p{

    text-align:center;

    color:#94a3b8;

    margin-bottom:30px;
}

input,
textarea{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    border:none;

    outline:none;

    border-radius:14px;

    background:#0f172a;

    color:white;

    font-size:15px;
}

textarea{
    resize:none;
}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#3b82f6;
}

#success{

    margin-top:18px;

    text-align:center;

    color:#22c55e;

    display:none;
}

</style>

</head>

<body>

<div class="container">

    <h1>Student Feedback</h1>

    <p>
        Your feedback helps improve the portal.
    </p>

    <form id="feedbackForm">

        <input
        type="text"
        id="name"
        placeholder="Your Name"
        required>

        <input
        type="email"
        id="email"
        placeholder="Your Email"
        required>

        <textarea
        id="message"
        rows="5"
        placeholder="Write your feedback"
        required></textarea>

        <button type="submit">
            Submit Feedback
        </button>

    </form>

    <div id="success">
        Feedback sent successfully!
    </div>

</div>

<script>

/* EMAILJS INIT */

emailjs.init("kqnCcPYqtdwl_Oaqt");

/* FORM */

document
.getElementById("feedbackForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const templateParams = {

        from_name:
        document.getElementById("name").value,

        from_email:
        document.getElementById("email").value,

        message:
        document.getElementById("message").value
    };

    emailjs.send(

        "service_08nkbcb",
        "template_2yrnipb",
        templateParams

    ).then(function(){

        document.getElementById("success")
        .style.display = "block";

        document.getElementById("feedbackForm")
        .reset();

    }).catch(function(error){

        alert("Failed to send feedback");

        console.log(error);
    });

});

</script>
<script src="cursor.js"></script>
</body>
</html>
