<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0b1120;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* GLOW BACKGROUND */

body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#2563eb;
    border-radius:50%;
    filter:blur(160px);
    top:-200px;
    left:-200px;
    opacity:0.18;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    width:450px;
    height:450px;
    background:#7c3aed;
    border-radius:50%;
    filter:blur(160px);
    bottom:-200px;
    right:-200px;
    opacity:0.18;
    z-index:-2;
}

/* GRID PATTERN */

.pattern{
    position:fixed;
    width:100%;
    height:100%;
    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:-1;
}

/* TITLE */

h1{
    text-align:center;
    margin-top:40px;
    font-size:38px;
    font-weight:700;
    letter-spacing:1px;
}

/* SEARCH */

.search-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.search-box input{
    width:90%;
    max-width:520px;

    padding:16px 20px;

    border:none;
    outline:none;

    border-radius:20px;

    background:rgba(255,255,255,0.07);

    color:white;

    font-size:15px;

    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.08);

    transition:0.3s;
}

.search-box input:focus{
    border-color:#3b82f6;

    box-shadow:
    0 0 15px rgba(59,130,246,0.4);
}

/* GRID */

.grid{
    width:100%;
    max-width:1200px;

    margin:50px auto;

    padding:20px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:28px;
}

/* CARDS */

.card{
    position:relative;

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:28px;

    padding:35px 20px;

    text-align:center;

    cursor:pointer;

    transition:0.35s ease;

    overflow:hidden;

    backdrop-filter:blur(14px);

    box-shadow:
    0 8px 30px rgba(0,0,0,0.25);
}

/* GLOW EFFECT INSIDE CARD */

.card::before{
    content:'';

    position:absolute;

    width:120px;
    height:120px;

    background:
    rgba(59,130,246,0.15);

    border-radius:50%;

    top:-50px;
    right:-50px;

    filter:blur(30px);
}

/* CARD TEXT */

.card{
    font-size:18px;
    font-weight:600;
    line-height:1.6;
}

/* CARD HOVER */

.card:hover{

    transform:
    translateY(-8px)
    scale(1.02);

    border-color:
    rgba(59,130,246,0.35);

    background:
    rgba(37,99,235,0.12);

    box-shadow:
    0 10px 35px rgba(37,99,235,0.25);
}

/* BACK BUTTON */

.back{

    width:max-content;

    margin:10px auto 50px;

    padding:14px 22px;

    border-radius:16px;

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid rgba(255,255,255,0.08);

    cursor:pointer;

    transition:0.3s;
}

.back:hover{

    background:
    rgba(255,255,255,0.12);
}

/* MOBILE */

@media(max-width:768px){

    h1{
        font-size:28px;
        padding:0 15px;
    }

    .grid{
        grid-template-columns:1fr;
        padding:18px;
    }

    .card{
        padding:30px 18px;
    }

}

</style>
</head>

let selectedDept = "";

/* ELEMENTS */
const container = document.getElementById("container");
const title = document.getElementById("title");
const backBtn = document.getElementById("backBtn");

/* SHOW DEPARTMENTS */
function showDepartments(){
    container.innerHTML = "";

    Object.keys(data).forEach(dep=>{
        const div = document.createElement("div");
        div.className = "card";
        div.innerText = dep;

        div.onclick = () => {
            selectedDept = dep;
            showSemesters(dep);
        };

        container.appendChild(div);
    });

    title.innerText = "🏫 Choose Department";
    backBtn.style.display = "none";
}

/* SHOW SEMESTERS */
function showSemesters(dep){
    container.innerHTML = "";

    Object.keys(data[dep]).forEach(sem=>{
        const div = document.createElement("div");
        div.className = "card";
        div.innerText = sem;

        div.onclick = () => {
            window.open(data[dep][sem], "_blank");

        };

        container.appendChild(div);
    });

    title.innerText = dep + " - Semesters";
    backBtn.style.display = "inline-block";
}

/* BACK */
function goBack(){
    showDepartments();
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function(){
    let value = this.value.toLowerCase();
    let items = document.querySelectorAll(".card");

    items.forEach(item=>{
        item.style.display = item.innerText.toLowerCase().includes(value)
        ? "block" : "none";
    });
});

/* INIT */
